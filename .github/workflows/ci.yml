name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Placeholder credentials for the unit suite. These reach nothing: the unit
  # tests never open a socket. Integration tests get service containers from
  # M1.2 onward (docs/TESTING.md §2).
  DCP_ENVIRONMENT: local
  DCP_DEMO_MODE: "true"
  DCP_DATABASE_URL: postgresql+psycopg://placeholder:placeholder@localhost:5432/placeholder
  DCP_REDIS_URL: redis://localhost:6379/0

jobs:
  backend:
    name: Backend (lint, types, tests, audit)
    runs-on: ubuntu-latest
    services:
      # Real PostgreSQL, never SQLite: the migration tests exist to verify
      # partial unique indexes, CHECK constraints, partitioning and triggers,
      # and SQLite would pass tests that PostgreSQL fails
      # (docs/TESTING.md §1).
      postgres:
        image: postgres:17.2-alpine
        env:
          POSTGRES_DB: dcp_test
          POSTGRES_USER: dcp
          POSTGRES_PASSWORD: placeholder-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dcp -d dcp_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7.4.1-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          # The changed-line coverage gate below diffs against the pull
          # request's base, so the base commit has to be in the clone.
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Install from the lockfile
        # --frozen: the lockfile is the source of truth (AD-16). If pyproject
        # and uv.lock disagree, fail rather than silently re-resolving.
        run: uv sync --frozen --all-groups

      - run: uv run ruff check --output-format=github .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run bandit -q -r app
      # Unit tests first: they are fast, need nothing, and failing here means
      # there is no point paying for the integration run.
      - name: Unit tests
        run: uv run pytest -m "not integration" --cov=app --cov-report=term-missing

      - name: Integration tests (real PostgreSQL)
        env:
          # Deliberately not DCP_-prefixed: that prefix is reserved for
          # application settings, and an unrecognised DCP_* variable is a
          # startup error by design.
          TEST_DATABASE_URL: postgresql+psycopg://dcp:placeholder-password@localhost:5432/dcp_test
          # M1.3: the authentication suite needs a real Redis (session store,
          # single-use `state`, rate limiter). Without it those tests skip while
          # the rest still pass, so the summary would read green with the
          # session controls untested. Database 1, so the broker is untouched.
          TEST_REDIS_URL: redis://localhost:6379/1
        run: uv run pytest -m integration --cov=app --cov-append --cov-report=term-missing --cov-report=xml

      - name: Fail if integration tests were skipped
        # A skipped integration suite looks identical to a passing one in the
        # summary. This makes "the database was not reachable" a build failure
        # rather than a green tick.
        env:
          TEST_DATABASE_URL: postgresql+psycopg://dcp:placeholder-password@localhost:5432/dcp_test
          TEST_REDIS_URL: redis://localhost:6379/1
        run: |
          set -euo pipefail
          output="$(uv run pytest -m integration --collect-only -q 2>&1 | tail -3)"
          echo "$output"
          if echo "$output" | grep -qi "no tests ran\|skipped"; then
            echo "Integration tests did not run against PostgreSQL." >&2
            exit 1
          fi
      - name: Migrations apply to an empty database
        env:
          DCP_ENVIRONMENT: local
          DCP_DEMO_MODE: "true"
          DCP_DATABASE_URL: postgresql+psycopg://dcp:placeholder-password@localhost:5432/dcp_test
          DCP_REDIS_URL: redis://localhost:6379/0
        run: |
          uv run alembic upgrade head
          uv run alembic downgrade base
          uv run alembic upgrade head

      - name: Changed-line coverage floor
        # OPEN-22's working default: 80 % on **changed** code, gating per-diff
        # (docs/TESTING.md §19). Not a total: a repository-wide percentage can
        # sit above any threshold while the branch under review adds an
        # untested authorisation path.
        #
        # Pull requests only. A push to `main` has no diff to measure against
        # that means anything — the merge has already happened — and gating it
        # would either block the merge commit or silently compare against an
        # arbitrary parent.
        if: github.event_name == 'pull_request'
        run: |
          uv run python ../scripts/check_coverage_diff.py \
            --coverage coverage.xml \
            --base "${{ github.event.pull_request.base.sha }}" \
            --label "backend changed lines"

      - name: Dependency vulnerability audit
        # NOT --strict: the local project is not published to PyPI, and --strict
        # turns that unauditable-package notice into a failure. Plain pip-audit
        # still exits non-zero on an actual vulnerability, which is the gate.
        run: uv run pip-audit

  frontend:
    name: Frontend (lint, types, tests, build, audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          # As in the backend job: the coverage gate needs the base commit.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm run build
      - run: npm audit --audit-level=high

      - name: Changed-line coverage floor
        # Same floor and the same script as the backend: vitest emits a
        # Cobertura report alongside lcov so one parser serves both ends.
        if: github.event_name == 'pull_request'
        run: |
          python ../scripts/check_coverage_diff.py \
            --coverage coverage/cobertura-coverage.xml \
            --base "${{ github.event.pull_request.base.sha }}" \
            --label "frontend changed lines"

  contracts:
    name: API types match the backend schema
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install both toolchains
        # The gate spans both ends of the contract, so it needs both.
        run: |
          cd backend && uv sync --frozen --all-groups
          cd ../frontend && npm ci

      - name: Regenerate the TypeScript API types
        run: ./scripts/generate-api-types.sh

      - name: Fail if the committed types drifted
        # docs/TECH_STACK.md §11 rule 3: a backend schema change that was not
        # propagated breaks the build instead of the dashboard. The fix is to
        # run `npm run generate:api` and commit the result.
        run: git diff --exit-code -- frontend/src/api/schema.ts

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: a secret deleted in a later commit is still leaked.
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  images:
    name: Build and scan images
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            context: backend
            target: production
          - name: frontend
            context: frontend
            target: production
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          target: ${{ matrix.target }}
          push: false
          load: true
          tags: dcp-${{ matrix.name }}:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan ${{ matrix.name }}
        # v0.28.0's nested `aquasecurity/setup-trivy@v0.2.1` no longer resolves
        # ("unable to find version"), which failed the job at "Set up job".
        # v0.36.0 pins its nested actions by commit SHA. Not itself SHA-pinned
        # (AD-16 asks for that for actions too).
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: dcp-${{ matrix.name }}:ci
          format: table
          exit-code: '1'
          severity: HIGH,CRITICAL
          ignore-unfixed: true

  compose:
    name: Compose smoke test
    runs-on: ubuntu-latest
    env:
      # The workflow-level `DCP_DATABASE_URL` / `DCP_REDIS_URL` point at
      # `localhost` for the unit suite and the schema export. Docker Compose
      # interpolates `${DCP_DATABASE_URL:-...}` from *this* environment, so left
      # alone they replace the Compose defaults and hand every container a URL
      # to a PostgreSQL that is not in it (`migrate` exits 1, connection
      # refused). Empty is "unset" to `:-`, so the Compose defaults win.
      DCP_DATABASE_URL: ''
      DCP_REDIS_URL: ''
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose configuration
        # Every profile, not just core: a typo in the observability services
        # would otherwise only surface when the smoke test reached step 18.
        run: |
          docker compose -f infra/compose/docker-compose.yml \
            --profile core --profile mocks --profile observability --profile logs \
            config --quiet
      - name: Validate the Prometheus configuration
        # promtool from the pinned image, so the config is checked by the
        # version that will load it. A bad scrape config makes Prometheus exit
        # at startup, which reads as "the container is unhealthy" rather than
        # as the YAML error it is.
        run: |
          docker run --rm --entrypoint promtool \
            -v "$PWD/infra/prometheus:/etc/prometheus:ro" \
            prom/prometheus:v3.0.1 check config /etc/prometheus/prometheus.yml
      - name: Smoke test the stack
        # Starts the core, mocks and (at step 18) observability profiles, and
        # asserts docs/TESTING.md §11 steps 1-12 — step 8's Prometheus half
        # included, which M2.1 made assertable for the first time.
        #
        # Step 18b (M2.4) also starts a container that runs systemd, which needs
        # SYS_ADMIN and a writable cgroup tree. SMOKE_SYSTEMD=auto (the default)
        # runs it and, if the runner cannot start it, ends with "PASSED, BUT
        # INCOMPLETE ... NOT RUN" rather than failing or silently passing.
        # OBSERVED (2026-10-17): the hosted runner cannot start it, so on this job
        # step 18b is NOT RUN and the run ends "PASSED, BUT INCOMPLETE" (PROGRESS.md
        # issue 69). Do not switch this to `require` until the reason is known.
        run: ./scripts/smoke-test.sh

  env-example:
    name: .env.example is complete
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
      - run: uv sync --frozen --all-groups
      - name: Every live setting is documented
        # Imports the Settings model rather than parsing config.py, so a field
        # that moved cannot escape the check (M1.7).
        run: uv run python ../scripts/check_env_example.py

  alert-rules:
    name: Alert rules are current and pass promtool
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
      - run: uv sync --frozen --all-groups
        working-directory: backend
      - name: The committed rule file is what the generator produces
        # The rules are generated from DCP_UTILISATION_THRESHOLDS, DCP_HEALTH_THRESHOLDS and
        # the metric catalogue (M3.3, OPEN-46), so a hand edit or a changed threshold that
        # was not regenerated is a second copy of the numbers.
        working-directory: backend
        run: uv run python ../scripts/gen_alert_rules.py --check
      - name: promtool checks and tests the rule file
        # From the pinned image, so the rules are checked by the version that loads them:
        # `check rules` for syntax, `test rules` against seeded series.
        run: |
          docker run --rm --entrypoint promtool -v "$PWD/infra/prometheus:/p:ro" \
            prom/prometheus:v3.0.1 check rules /p/rules/dcp-alerts.yml
          docker run --rm --entrypoint promtool -v "$PWD/infra/prometheus:/p:ro" \
            prom/prometheus:v3.0.1 test rules /p/tests/dcp-alerts.test.yml

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    env:
      # The workflow-level `DCP_DATABASE_URL` / `DCP_REDIS_URL` point at
      # `localhost` for the unit suite and the schema export. Docker Compose
      # interpolates `${DCP_DATABASE_URL:-...}` from *this* environment, so left
      # alone they replace the Compose defaults and hand every container a URL
      # to a PostgreSQL that is not in it (`migrate` exits 1, connection
      # refused). Empty is "unset" to `:-`, so the Compose defaults win.
      DCP_DATABASE_URL: ''
      DCP_REDIS_URL: ''
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Install the browser
        # Chromium only. The suite asserts behaviour and accessibility, not
        # cross-browser rendering; three browsers would triple the runtime for
        # no new signal at this milestone.
        run: npx playwright install --with-deps chromium
        working-directory: frontend

      - name: Start the stack
        env:
          # Issue 50: a dashboard aggregate is cached for 15 s, so a test that
          # writes and then reads a total would flake for a reason unrelated to
          # the test. Disabling the cache is the fix; sleeping is not.
          DCP_DASHBOARD_CACHE_TTL_SECONDS: '0'
        run: |
          docker compose -f infra/compose/docker-compose.yml \
            --profile core --profile mocks \
            up -d --build --wait --wait-timeout 300

      - name: Run the end-to-end suite
        run: npm run test:e2e
        working-directory: frontend

      - name: Stack logs on failure
        if: failure()
        run: docker compose -f infra/compose/docker-compose.yml --profile core --profile mocks logs --tail=200

      - name: Upload traces and screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: frontend/e2e/.artifacts
          retention-days: 7

      - name: Tear down
        if: always()
        run: docker compose -f infra/compose/docker-compose.yml --profile core --profile mocks down -v

  docs:
    name: Documentation links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check relative links and anchors
        run: python scripts/check_doc_links.py .
