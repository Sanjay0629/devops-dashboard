[project]
name = "dcp-backend"
version = "0.1.0"
description = "DevOps Control Plane — backend API and workers"
requires-python = ">=3.12,<3.13"

# Ranges here, exact pins in uv.lock (AD-16). CI installs from the lockfile only.
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.32,<1.0",
    "pydantic>=2.9,<3.0",
    "pydantic-settings>=2.6,<3.0",
    "sqlalchemy[asyncio]>=2.0,<3.0",
    "psycopg[binary,pool]>=3.2,<4.0",
    "redis>=5.2,<7.0",
    "celery[redis]>=5.4,<6.0",
    "structlog>=24.4,<26.0",
    "alembic>=1.14,<2.0",
    # M1.3: outbound HTTP (OIDC discovery, JWKS, token exchange). Already an
    # approved choice (docs/TECH_STACK.md §4); promoted from the dev group
    # because the OIDC client is runtime code.
    "httpx>=0.27,<1.0",
    # M1.3: ID-token (JWS) verification. TECH_STACK §10 rung 3 fails here —
    # hand-rolling RS256/JWKS verification is the one place not to save
    # lines. Pulls `cryptography`. Alternatives: authlib (larger surface,
    # bundles an OAuth client we do not want), python-jose (stale).
    "pyjwt[crypto]>=2.10,<3.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3,<10.0",
    "pytest-asyncio>=0.24,<2.0",
    "pytest-cov>=6.0,<8.0",
    "pytest-timeout>=2.3,<3.0",
    "ruff>=0.8,<1.0",
    "mypy>=1.13,<2.0",
    "bandit>=1.8,<2.0",
    "pip-audit>=2.7,<3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

# ---------------------------------------------------------------- ruff

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["app", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "N",        # pep8-naming
    "UP",       # pyupgrade
    "B",        # bugbear
    "A",        # builtins shadowing
    "C4",       # comprehensions
    "DTZ",      # timezone-aware datetimes — naive timestamps are a bug here
    "T20",      # no print()
    "SIM",      # simplify
    "PTH",      # pathlib
    "RUF",
    "S",        # bandit rules (SECURITY.md: no shell sinks, no asserts in app code)
]
ignore = [
    "S101",     # assert — used by tests; app code does not rely on it
    # RUF002/RUF003 flag "ambiguous" unicode in docstrings and comments. The
    # prose here deliberately uses en dashes and §. RUF001 stays on, because an
    # ambiguous character inside a *string literal* could actually matter.
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
# Tests may assert and may hold throwaway credentials-shaped literals.
"tests/**" = ["S105", "S106", "S107"]
# A fixture imported by name and then taken as a parameter is the pytest idiom, and ruff reads
# the parameter as a redefinition (the alert suite carries a noqa on one parameter; this module
# has thirty).
"tests/integration/test_notifications_api.py" = ["F811"]
# Migrations hold autogenerated SQL string literals that cannot be wrapped
# without mangling the SQL. Everything else still applies.
"alembic/versions/**" = ["E501"]

[tool.ruff.lint.isort]
# Without this, `app` is sorted as a third-party package inside tests.
known-first-party = ["app"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path"]

# ---------------------------------------------------------------- mypy

[tool.mypy]
python_version = "3.12"
files = ["app"]
strict = true
warn_unreachable = true
warn_unused_ignores = true
disallow_any_unimported = true
show_error_codes = true
pretty = true

[[tool.mypy.overrides]]
module = ["celery.*", "kombu.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Celery and kombu ship no py.typed marker, so their decorators and return
# types degrade to Any under strict mode. Narrowed to the worker package so the
# rest of the codebase keeps full strictness.
module = ["app.workers.*"]
disallow_any_unimported = false
disable_error_code = ["untyped-decorator", "no-any-unimported"]

# ---------------------------------------------------------------- pytest

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# A hung test must fail, not stall. Integration tests talk to a real database,
# and without a deadline one blocked connection hangs CI for the job's maximum
# duration while looking indistinguishable from slow progress.
addopts = "-q --strict-markers --strict-config --timeout=120 --timeout-method=thread"
markers = [
    "integration: needs PostgreSQL and Redis containers",
    "security: security control verification",
    "slow: long-running",
    "real_integration: opt-in, hits a real external system; never runs in CI",
]

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]
