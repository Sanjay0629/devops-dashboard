# Alembic configuration.
#
# sqlalchemy.url is deliberately absent: the URL comes from DCP_DATABASE_URL via
# app.core.config (see alembic/env.py), so a credential never lives in a file
# that is committed (docs/SECURITY.md §9).
[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os
# Avoids alembic's legacy space/comma/colon splitting of prepend_sys_path.
path_separator = os
# Revisions are numbered so their order is obvious in a directory listing.
file_template = %%(rev)s_%%(slug)s

[post_write_hooks]
hooks = ruff_format
ruff_format.type = exec
ruff_format.executable = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
