# Prometheus configuration for the local development stack (M2.1).
#
# REAL as of M2.1, where it used to be a placeholder: the `node` job below is
# scraped, the series it produces are what `app/metrics/templates.py` queries,
# and `scripts/smoke-test.sh` step 18 asserts both through the backend's own
# client. The targets are still **static**: generating this list from inventory
# is `OPEN-14` and lands with M2.3, which is also what `--web.enable-lifecycle`
# on the container is there for.
#
# `job: node` is load-bearing. `app/metrics/templates.NODE_JOB` matches it, so
# the `agent_up` template reads `up{job="node", instance=...}` rather than
# every scrape job that happens to share an instance label.
#
# What this does NOT claim: `node-exporter` runs in its own container with no
# host mounts, so it reports the *container's* view of CPU, memory and
# filesystems, not the Docker host's. That is deliberate — mounting the host
# root into a container is a posture change a development convenience does not
# justify — and it is enough for what M2.1 needs: a real exporter producing
# real `node_*` series that the real templates are verified against. Host-level
# collection belongs to the agent work (M6.1) and to real registered servers.

global:
  # 15s rather than 30s so that a `rate()` window has two samples within
  # half a minute. The smoke test and a developer both wait for the first
  # usable CPU reading, and at 30s that wait is a minute.
  scrape_interval: 15s
  # Shorter than the interval, or a slow target overlaps its own next scrape.
  scrape_timeout: 10s
  evaluation_interval: 30s
  external_labels:
    environment: local

# Alert rules land in M3.3 and are version-controlled here (AD-06).
rule_files: []

scrape_configs:
  # Prometheus scraping itself. Cheap, and it is what makes "is Prometheus
  # collecting anything at all" answerable without a second exporter.
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  # The host exporter the metric templates target. `instance` defaults to the
  # target address, so `node-exporter:9100` is the value a `servers` row's
  # `metrics_instance` has to carry to join against it (AD-04).
  - job_name: node
    static_configs:
      - targets: ['node-exporter:9100']
        labels:
          environment: local

  # The `dcp-backend` job that used to be here has been removed. The backend
  # exposes no `/metrics` endpoint yet (docs/ARCHITECTURE.md §11 describes the
  # self-monitoring that will add one), so the job could only ever report a
  # permanently failing target — which makes "is every target up?" useless as
  # an assertion and presents a scrape that does not exist as one that does
  # (CLAUDE.md §7). It returns with the endpoint.
