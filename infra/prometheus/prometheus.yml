# Placeholder scrape config. M2.1 replaces the static target below with a
# file_sd target list generated from inventory (OPEN-14) and adds the
# per-OS-family relabelling the metric templates depend on.
global:
  scrape_interval: 30s
  evaluation_interval: 30s
  external_labels:
    environment: local

# Alert rules land in M3.3 and are version-controlled here (AD-06).
rule_files: []

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  - job_name: node
    static_configs:
      - targets: ['node-exporter:9100']
        labels:
          environment: local

  - job_name: dcp-backend
    metrics_path: /metrics
    static_configs:
      - targets: ['backend:8000']
