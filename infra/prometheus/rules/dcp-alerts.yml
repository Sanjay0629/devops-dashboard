# GENERATED by scripts/gen_alert_rules.py -- do not edit by hand.
#
# Source of the numbers: DCP_UTILISATION_THRESHOLDS (CPU, memory, disk) and
# DCP_HEALTH_THRESHOLDS (how long a host may be silent), over the metric catalogue's
# shipped defaults. Source of the expressions: app/metrics/templates.py. Source of the
# rule names: app/alerts/catalogue.py. `check-all.sh` fails when this file is stale.
# Regenerate with:  cd backend && uv run python ../scripts/gen_alert_rules.py
#
# Warning and critical are mutually exclusive on purpose (OPEN-41).
# `for:` durations are working defaults, not measurements (OPEN-46).

groups:
  - name: dcp-watchdog
    rules:
      - alert: DcpWatchdog
        expr: "vector(1)"
        labels:
          severity: none
        annotations:
          summary: "Always firing: proves rule evaluation and delivery work"
  - name: dcp-development
    rules:
      - alert: HostNotReporting
        expr: "up{job=\"node\",environment=\"development\"} == 0"
        for: 300s
        labels:
          severity: critical
          condition: host_not_reporting
          environment: development
        annotations:
          summary: "Host {{ $labels.instance }} has stopped reporting"
      - alert: HostCpuWarning
        expr: "(100 * (1 - avg without (cpu, mode) (rate(node_cpu_seconds_total{mode=\"idle\",job=\"node\",environment=\"development\"}[300s]))) >= 80) unless (100 * (1 - avg without (cpu, mode) (rate(node_cpu_seconds_total{mode=\"idle\",job=\"node\",environment=\"development\"}[300s]))) >= 90)"
        for: 600s
        labels:
          severity: warning
          condition: cpu
          environment: development
        annotations:
          summary: "CPU on {{ $labels.instance }} is at {{ $value | printf \"%.1f\" }}% (warning at 80%)"
      - alert: HostCpuCritical
        expr: "100 * (1 - avg without (cpu, mode) (rate(node_cpu_seconds_total{mode=\"idle\",job=\"node\",environment=\"development\"}[300s]))) >= 90"
        for: 600s
        labels:
          severity: critical
          condition: cpu
          environment: development
        annotations:
          summary: "CPU on {{ $labels.instance }} is at {{ $value | printf \"%.1f\" }}% (critical at 90%)"
      - alert: HostMemoryWarning
        expr: "(100 * (1 - node_memory_MemAvailable_bytes{job=\"node\",environment=\"development\"} / node_memory_MemTotal_bytes{job=\"node\",environment=\"development\"}) >= 85) unless (100 * (1 - node_memory_MemAvailable_bytes{job=\"node\",environment=\"development\"} / node_memory_MemTotal_bytes{job=\"node\",environment=\"development\"}) >= 95)"
        for: 300s
        labels:
          severity: warning
          condition: memory
