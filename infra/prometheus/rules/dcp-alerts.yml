      - alert: HostMemoryCritical
        expr: "100 * (1 - node_memory_MemAvailable_bytes{job=\"node\",environment=\"development\"} / node_memory_MemTotal_bytes{job=\"node\",environment=\"development\"}) >= 95"
        for: 300s
        labels:
          severity: critical
          condition: memory
          environment: development
        annotations:
          summary: "Memory on {{ $labels.instance }} is at {{ $value | printf \"%.1f\" }}% (critical at 95%)"
      - alert: HostDiskWarning
        expr: "(100 * max without (device, mountpoint, fstype) (1 - node_filesystem_avail_bytes{fstype!~\"tmpfs|overlay|squashfs|ramfs|devtmpfs|efivarfs|iso9660\",job=\"node\",environment=\"development\"} / node_filesystem_size_bytes{fstype!~\"tmpfs|overlay|squashfs|ramfs|devtmpfs|efivarfs|iso9660\",job=\"node\",environment=\"development\"}) >= 85) unless (100 * max without (device, mountpoint, fstype) (1 - node_filesystem_avail_bytes{fstype!~\"tmpfs|overlay|squashfs|ramfs|devtmpfs|efivarfs|iso9660\",job=\"node\",environment=\"development\"} / node_filesystem_size_bytes{fstype!~\"tmpfs|overlay|squashfs|ramfs|devtmpfs|efivarfs|iso9660\",job=\"node\",environment=\"development\"}) >= 95)"
