# DevOps Control Plane — local development stack (PRD §11, docs/ARCHITECTURE.md §12)
#
# Profiles keep the default `up` light:
#   core          frontend, backend, worker, beat, postgres, redis   (M1.1)
#   observability prometheus, grafana, loki, node-exporter           (M2.1, M3.1)
#   logs          alloy                                             (M3.1)
#   mocks         mock-idp (M1.3), mock-jenkins (M5.1, not yet implemented)
#
# Run from the repository root:
#   docker compose -f infra/compose/docker-compose.yml --profile core up
#
# PARTLY VERIFIED: `postgres`, `redis` and the `mocks` profile's `mock-idp`
# have been started and used. The full `core` stack (backend/worker/beat/
# frontend containers) and scripts/smoke-test.sh remain unexecuted, and the
# observability and logs profiles are still placeholders whose services arrive
# with M2.1/M3.1. See PROGRESS.md.
#
# Image versions are exact tags but are NOT digest-pinned yet; AD-16 requires
# digests. scripts/pin-digests.sh resolves them once a daemon is available.

name: dcp

x-backend-env: &backend-env
  DCP_ENVIRONMENT: ${DCP_ENVIRONMENT:-local}
  DCP_LOG_LEVEL: ${DCP_LOG_LEVEL:-INFO}
  DCP_DEMO_MODE: ${DCP_DEMO_MODE:-true}
  DCP_API_BASE_PATH: ${DCP_API_BASE_PATH:-/api/v1}
  DCP_DATABASE_URL: ${DCP_DATABASE_URL:-postgresql+psycopg://dcp:placeholder-password@postgres:5432/dcp}
  DCP_REDIS_URL: ${DCP_REDIS_URL:-redis://redis:6379/0}
  DCP_DATABASE_STATEMENT_TIMEOUT_MS: ${DCP_DATABASE_STATEMENT_TIMEOUT_MS:-5000}
  DCP_READINESS_TIMEOUT_SECONDS: ${DCP_READINESS_TIMEOUT_SECONDS:-3.0}
  # Passed through so the E2E suite can set it to 0. A dashboard aggregate is
  # cached for 15s by default (issue 50), so a test that writes and then reads
  # a total would flake for a reason that has nothing to do with the test.
  # Disabling the cache is the fix; sleeping is not (M1.7).
  DCP_DASHBOARD_CACHE_TTL_SECONDS: ${DCP_DASHBOARD_CACHE_TTL_SECONDS:-15}
  #
  # NOTE: this block enumerates the settings the stack passes through, so a
  # setting that exists on the Settings model but is absent here keeps its
  # application default no matter what .env says. Five such settings exist
  # today (PROGRESS issue 54); they all have correct defaults, so nothing is
  # broken, but a developer who sets one in .env would see no effect.
  DCP_CORS_ORIGINS: ${DCP_CORS_ORIGINS:-}
  # M1.3. Defaults point at the mock-idp service, which only exists in the
  # `mocks` profile — without it /auth/login answers 503, which is the honest
  # result for "no identity provider is reachable". Set these to a real IdP to
  # replace it; `iss` is compared literally, so the issuer must be byte-exact.
  DCP_OIDC_ISSUER: ${DCP_OIDC_ISSUER:-http://localhost:9000}
  DCP_OIDC_CLIENT_ID: ${DCP_OIDC_CLIENT_ID:-dcp-local}
  DCP_OIDC_CLIENT_SECRET: ${DCP_OIDC_CLIENT_SECRET:-placeholder-client-secret}
  # Points at the **frontend** origin, not the backend's. In production the SPA
  # and the API share one origin behind the reverse proxy (AD-02), and the dev
  # server's proxy reproduces that — so the whole flow, and the `next` redirect
  # at the end of it, stays on the origin the operator is actually browsing.
  # Pointing it at :8000 instead would land the user on the backend, which
  # serves no SPA. Register this value with the IdP exactly.
  DCP_OIDC_REDIRECT_URL: ${DCP_OIDC_REDIRECT_URL:-http://localhost:5173/api/v1/auth/callback}
  DCP_SESSION_IDLE_TIMEOUT_SECONDS: ${DCP_SESSION_IDLE_TIMEOUT_SECONDS:-1800}
  DCP_SESSION_ABSOLUTE_TIMEOUT_SECONDS: ${DCP_SESSION_ABSOLUTE_TIMEOUT_SECONDS:-28800}
  # Passed through so a test environment can raise it. The /auth/* class fails
  # CLOSED (AD-19), and the E2E suite legitimately signs in several times per
  # run — at the default of 10 per 300s, a couple of local re-runs answer 429
  # and the failure reads as "the identity provider did not respond".
  DCP_AUTH_RATE_LIMIT_MAX: ${DCP_AUTH_RATE_LIMIT_MAX:-10}
  DCP_AUTH_RATE_LIMIT_WINDOW_SECONDS: ${DCP_AUTH_RATE_LIMIT_WINDOW_SECONDS:-300}

# Applied to every service: no new privileges, bounded resources.
x-hardening: &hardening
  security_opt:
    - no-new-privileges:true
  restart: unless-stopped

services:
  postgres:
    <<: *hardening
    profiles: [core]
    image: postgres:17.2-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dcp}
      POSTGRES_USER: ${POSTGRES_USER:-dcp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-placeholder-password}
      # Deterministic collation, so index ordering does not shift under us.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      # Host port is overridable: a developer machine often already runs
      # PostgreSQL on 5432. Loopback only — never 0.0.0.0.
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Creates `dcp_test` on first init, so the integration suite has a
      # database without a documented manual psql step — and so that
      # scripts/smoke-test.sh's `down -v` does not silently remove it.
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dcp} -d ${POSTGRES_DB:-dcp}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 1g }

  redis:
    <<: *hardening
    profiles: [core]
    image: redis:7.4.1-alpine
    # noeviction on the broker database: evicting a queued task loses work
    # (docs/TECH_STACK.md §4.2). appendonly survives a restart.
    command: >
      redis-server
      --appendonly yes
      --maxmemory-policy noeviction
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6380}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 512m }

  # One-shot: applies the schema, then exits. Added by M1.7.
  #
  # Nothing used to do this. The stack came up "healthy" on an empty volume
  # with no schema at all, because the container healthcheck is /healthz
  # (liveness) while the migration gate lives on /readyz — so a fresh clone
  # followed the README exactly and got a 503 backend and a login that could
  # not reach a `users` table. It worked for five milestones only because the
  # first developer ran `alembic upgrade head` by hand and the volume outlived
  # every later `up`. scripts/smoke-test.sh step 19 (`down -v` then `up`) is
  # what finally caught it.
  #
  # A separate service rather than folding `alembic upgrade head` into the
  # backend's command, so that `worker` and `beat` are ordered behind the
  # schema too, and so this stays visibly a deployment step rather than
  # something the application does to itself at startup. No `AD-nn` governs
  # who applies migrations; this is the local stack's answer only, and a real
  # deployment still runs it as its own job (one runner, never N replicas
  # racing).
  migrate:
    <<: *hardening
    profiles: [core]
    build:
      context: ../../backend
      target: development
    environment: *backend-env
    command: ["alembic", "upgrade", "head"]
    volumes:
      - ../../backend/app:/app/app:ro
    depends_on:
      postgres: { condition: service_healthy }
    # Overrides `restart: unless-stopped` from the hardening anchor: a one-shot
    # that is restarted for ever is a crash loop that reports as a crash loop.
    restart: "no"
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 512m }

  backend:
    <<: *hardening
    profiles: [core]
    build:
      context: ../../backend
      target: development
    environment: *backend-env
    ports:
      - "127.0.0.1:${BACKEND_HOST_PORT:-8000}:8000"
      # Published here, not on mock-idp: that service shares this container's
      # network namespace (see its comment below), so its port is this
      # container's port. Harmless when the `mocks` profile is not running —
      # nothing is listening on it.
      - "127.0.0.1:${MOCK_IDP_HOST_PORT:-9000}:9000"
    volumes:
      - ../../backend/app:/app/app:ro
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 1g }

  worker:
    <<: *hardening
    profiles: [core]
    build:
      context: ../../backend
      target: development
    environment: *backend-env
    command: ["celery", "-A", "app.workers.celery_app:celery_app", "worker", "--loglevel=INFO", "--concurrency=2", "-Q", "operations,deployments,integrations,notifications,maintenance"]
    volumes:
      - ../../backend/app:/app/app:ro
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    healthcheck:
      # CMD-SHELL, not CMD: in exec form there is no shell, so `$$HOSTNAME`
      # (compose's escape for a literal `$HOSTNAME`) was passed through to
      # celery verbatim and it pinged a node called `celery@$HOSTNAME`, which
      # exists nowhere. That is issue 49 — five retries of "No nodes replied
      # within time constraint", exit 69, on a worker that was answering the
      # whole time. Pinging *this* node rather than dropping `-d` keeps the
      # check about this container.
      test: ["CMD-SHELL", "celery -A app.workers.celery_app:celery_app inspect ping -d celery@$$HOSTNAME"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 1g }

  beat:
    <<: *hardening
    profiles: [core]
    build:
      context: ../../backend
      target: development
    environment: *backend-env
    # EXACTLY ONE beat instance. A second scheduler double-fires every job
    # (docs/ARCHITECTURE.md §13).
    command: ["celery", "-A", "app.workers.celery_app:celery_app", "beat", "--loglevel=INFO"]
    volumes:
      - ../../backend/app:/app/app:ro
    depends_on:
      redis: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    # The second half of issue 49, and a *different* fault from the worker's:
    # beat declared no healthcheck at all, so it inherited the backend image's
    # `curl localhost:8000/healthz`. Beat serves no HTTP, so that check could
    # only ever fail — "Failed to connect to localhost port 8000", forever.
    #
    # Disabled rather than replaced, because there is nothing here that can be
    # checked without claiming more than has been verified. Beat is this
    # container's main process, so Docker's own running state already carries
    # "the scheduler is alive", and `celery inspect` reports workers, never
    # beat.
    #
    # The schedule file was the candidate and was measured rather than assumed:
    # /app/celerybeat-schedule was written once at startup and its age then
    # climbed to 270s with no resync (sampled every 60s). Beat's maxinterval here
    # is 300s, so a staleness check would need a window above five minutes to
    # avoid calling a healthy scheduler sick — a signal too coarse to be worth
    # the claim, and the behaviour right at that boundary is unverified.
    #
    # (An earlier draft of this comment said "nothing for five hours". That
    # was wrong: it compared a container mtime against the host clock.)
    #
    # What *can* be verified is verified where the evidence exists:
    # scripts/smoke-test.sh asserts beat's container state and its startup log
    # line, and the worker round-trip proves the broker path end to end.
    healthcheck:
      disable: true
    deploy:
      replicas: 1
      resources:
        limits: { cpus: "0.25", memory: 256m }

  frontend:
    <<: *hardening
    profiles: [core]
    build:
      context: ../../frontend
      target: development
    ports:
      - "127.0.0.1:${FRONTEND_HOST_PORT:-5173}:5173"
    volumes:
      - ../../frontend/src:/app/src:ro
      - ../../frontend/index.html:/app/index.html:ro
      # The dev server's own config, so a proxy or port change does not need an
      # image rebuild. Without it the container keeps running the config baked
      # in at build time, which is how the unused VITE_DEV_PROXY_TARGET went
      # unnoticed until M1.3.
      - ../../frontend/vite.config.ts:/app/vite.config.ts:ro
    environment:
      # The dev server proxies /api and the probes to the backend, so the
      # browser sees a single origin.
      VITE_DEV_PROXY_TARGET: http://backend:8000
    depends_on:
      - backend
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 1g }

  # --- observability profile (M2.1 / M3.1) ----------------------------------
  # Config files are placeholders until those milestones; declared here so the
  # profile shape is settled and nothing has to be restructured later.

  prometheus:
    <<: *hardening
    profiles: [observability]
    image: prom/prometheus:v3.0.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=30d
      - --web.enable-lifecycle
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ../prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus

  node-exporter:
    <<: *hardening
    profiles: [observability]
    image: prom/node-exporter:v1.8.2
    # A sample scrape target, so M2.1 has something real to query.
    ports:
      - "127.0.0.1:9100:9100"

  loki:
    <<: *hardening
    profiles: [observability]
    image: grafana/loki:3.3.2
    command: ["-config.file=/etc/loki/loki-config.yaml"]
    ports:
      - "127.0.0.1:3100:3100"
    volumes:
      - ../loki:/etc/loki:ro
      - loki-data:/loki

  grafana:
    <<: *hardening
    profiles: [observability]
    image: grafana/grafana:11.4.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-placeholder-password}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana

  # --- mocks profile (M1.3 / M5.1) ------------------------------------------
  # DEVELOPMENT AIDS. Passing against these is not evidence that a real
  # integration works (CLAUDE.md §7). See infra/compose/mock-idp/README.md.

  mock-idp:
    <<: *hardening
    profiles: [mocks]
    build:
      context: ../../backend
      target: development
    # Shares the backend's network namespace, which is what makes one issuer
    # URL correct for both sides: the browser reaches the published
    # localhost:9000, and the backend reaches the same localhost:9000 from
    # inside the namespace. The `iss` claim is compared literally, so without
    # this the browser would need `localhost` and the backend `mock-idp`, and
    # one of the two would always be wrong.
    network_mode: "service:backend"
    environment:
      MOCK_IDP_ISSUER: ${DCP_OIDC_ISSUER:-http://localhost:9000}
      MOCK_IDP_CLIENT_ID: ${DCP_OIDC_CLIENT_ID:-dcp-local}
      MOCK_IDP_CLIENT_SECRET: ${DCP_OIDC_CLIENT_SECRET:-placeholder-client-secret}
    command: ["uvicorn", "mock_idp:app", "--host", "0.0.0.0", "--port", "9000", "--app-dir", "/mock-idp"]
    volumes:
      - ./mock-idp:/mock-idp:ro
    depends_on:
      backend: { condition: service_started }
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/healthz"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    deploy:
      resources:
        limits: { cpus: "0.25", memory: 256m }

  # --- logs profile (M3.1) ---------------------------------------------------
  alloy:
    <<: *hardening
    profiles: [logs]
    image: grafana/alloy:v1.5.1
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - /etc/alloy/config.alloy
    ports:
      - "127.0.0.1:12345:12345"
    volumes:
      - ../alloy:/etc/alloy:ro

volumes:
  postgres-data:
  redis-data:
  prometheus-data:
  loki-data:
  grafana-data:
